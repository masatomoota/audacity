<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audacity MCP Companion</title>
<style>
  :root {
    --bg: #1a1a1a;
    --surface: #252525;
    --surface2: #2e2e2e;
    --border: #3a3a3a;
    --text: #e8e8e8;
    --text-muted: #888;
    --user-bg: #1d4a8a;
    --user-text: #dceeff;
    --assistant-bg: #2a2a2a;
    --assistant-text: #e8e8e8;
    --tool-bg: #1e2820;
    --tool-border: #3a5040;
    --tool-text: #98c0a0;
    --accent: #4a9eff;
    --green: #4caf50;
    --red: #e05555;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    min-height: 56px;
  }

  .header-title {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
  }
  .header-title span { color: var(--accent); }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 11px;
    white-space: nowrap;
  }

  .mcp-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    margin-left: auto;
    white-space: nowrap;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }

  /* ── Conversation ── */
  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  /* Scrollbar */
  #conversation::-webkit-scrollbar { width: 6px; }
  #conversation::-webkit-scrollbar-track { background: transparent; }
  #conversation::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .msg-row.user { align-items: flex-end; }
  .msg-row.assistant { align-items: flex-start; }

  .bubble {
    max-width: min(680px, 85%);
    border-radius: var(--radius);
    padding: 12px 16px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-row.user .bubble {
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 3px;
  }

  .msg-row.assistant .bubble {
    background: var(--assistant-bg);
    color: var(--assistant-text);
    border-bottom-left-radius: 3px;
    border: 1px solid var(--border);
  }

  .role-label {
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ── Tool call blocks ── */
  .tool-blocks {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: min(680px, 85%);
  }

  .tool-block {
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 12px;
  }

  .tool-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    color: var(--tool-text);
    list-style: none;
  }
  .tool-summary::-webkit-details-marker { display: none; }
  .tool-summary::before {
    content: "▶";
    font-size: 9px;
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  details[open] .tool-summary::before { transform: rotate(90deg); }

  .tool-name-tag {
    font-weight: 600;
    font-family: var(--mono);
    color: #a0d0a0;
  }

  .tool-input-preview {
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .tool-detail {
    border-top: 1px solid var(--tool-border);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tool-section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .tool-code {
    font-family: var(--mono);
    background: #161616;
    border-radius: 6px;
    padding: 8px 10px;
    overflow-x: auto;
    white-space: pre;
    color: #c8e6c9;
    font-size: 11px;
    line-height: 1.5;
  }
  .tool-output { color: #b0c8b0; }

  /* ── Thinking indicator ── */
  .thinking {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 13px;
    padding: 0 4px;
  }
  .thinking-dots { display: flex; gap: 4px; }
  .thinking-dots span {
    width: 6px; height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ── Error bubble ── */
  .error-bubble {
    background: #3a1515;
    border: 1px solid #7a2020;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13px;
    color: #ffaaaa;
    max-width: min(680px, 85%);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ── Input area ── */
  #input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    padding: 10px 14px;
    resize: none;
    min-height: 42px;
    max-height: 160px;
    overflow-y: auto;
    outline: none;
    transition: border-color 0.15s;
  }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--text-muted); }

  #send-btn {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    height: 42px;
    white-space: nowrap;
    transition: background 0.15s, opacity 0.15s;
    flex-shrink: 0;
  }
  #send-btn:hover { background: #3a8eef; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .input-hint {
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
    padding: 0 2px;
    margin-top: 4px;
  }

  /* ── Empty state ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--text-muted);
    padding: 40px;
    text-align: center;
  }
  .empty-icon { font-size: 48px; opacity: 0.4; }
  .empty-title { font-size: 20px; font-weight: 600; color: var(--text); opacity: 0.6; }
  .empty-desc { font-size: 14px; line-height: 1.6; max-width: 420px; }
  .example-prompts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }
  .example-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    padding: 6px 14px;
    transition: all 0.15s;
  }
  .example-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <div class="header-title">🎛️ Audacity <span>MCP</span> Companion</div>
  <div class="header-meta">
    <span class="badge" id="badge-provider">…</span>
    <span class="badge" id="badge-model">…</span>
  </div>
  <div class="mcp-indicator">
    <div class="dot" id="mcp-dot"></div>
    <span id="mcp-label">Checking MCP…</span>
  </div>
</header>

<div id="conversation">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">🎙️</div>
    <div class="empty-title">Talk to Audacity</div>
    <div class="empty-desc">
      Describe what you want to do — generate a tone, apply effects, export audio —
      and the AI will drive Audacity for you via its scripting interface.
    </div>
    <div class="example-prompts">
      <button class="example-btn" onclick="fillPrompt('What tracks are currently open?')">What tracks are open?</button>
      <button class="example-btn" onclick="fillPrompt('Create a new mono track and generate a 440 Hz sine tone for 3 seconds')">Generate a 440 Hz tone</button>
      <button class="example-btn" onclick="fillPrompt('Apply a fade-in to the first 2 seconds of audio')">Fade in first 2 s</button>
      <button class="example-btn" onclick="fillPrompt('Export the project to /tmp/output.wav')">Export to /tmp/output.wav</button>
      <button class="example-btn" onclick="fillPrompt('What commands are available for the Reverb effect?')">List Reverb commands</button>
      <button class="example-btn" onclick="fillPrompt('Select the entire track and amplify it to 80%')">Amplify to 80%</button>
    </div>
  </div>
</div>

<div id="input-area">
  <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
    <textarea
      id="msg-input"
      placeholder="Ask Audacity to do something… (Enter to send, Shift+Enter for newline)"
      rows="1"
    ></textarea>
    <div class="input-hint">Enter ↵ to send · Shift+Enter for newline</div>
  </div>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let messages = [];   // [{role, content}] — raw conversation history
let busy = false;

// ── Init ───────────────────────────────────────────────────────────────────
(async function init() {
  await Promise.all([loadConfig(), checkMcp()]);
  // Poll MCP status every 15 s
  setInterval(checkMcp, 15000);
})();

async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    const cfg = await r.json();
    document.getElementById('badge-provider').textContent = cfg.provider || '?';
    document.getElementById('badge-model').textContent = cfg.model || '?';
    if (!cfg.hasKey) {
      showSystemNote(
        `⚠️ No API key detected for provider "${cfg.provider}". ` +
        `Set it with: export ANTHROPIC_API_KEY=sk-ant-... (or OPENAI_API_KEY) then restart server.py`
      );
    }
  } catch (e) {
    document.getElementById('badge-provider').textContent = 'error';
  }
}

async function checkMcp() {
  const dot = document.getElementById('mcp-dot');
  const label = document.getElementById('mcp-label');
  try {
    const r = await fetch('/api/mcp_status');
    const data = await r.json();
    if (data.ok) {
      dot.className = 'dot green';
      const names = (data.tools || []).join(', ') || 'none';
      label.textContent = `MCP connected (${data.tools?.length || 0} tools)`;
      label.title = names;
    } else {
      dot.className = 'dot red';
      label.textContent = 'MCP offline';
      label.title = data.error || 'Cannot reach Audacity MCP server';
    }
  } catch (e) {
    dot.className = 'dot red';
    label.textContent = 'MCP offline';
    label.title = String(e);
  }
}

// ── Send message ────────────────────────────────────────────────────────────
async function sendMessage() {
  if (busy) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  // Clear input
  input.value = '';
  autoResize(input);

  // Hide empty state
  document.getElementById('empty-state').style.display = 'none';

  // Add user bubble
  appendUserBubble(text);

  // Append to message history
  messages.push({ role: 'user', content: text });

  // Show thinking
  const thinkingEl = appendThinking();
  setBusy(true);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });
    const data = await res.json();
    thinkingEl.remove();

    if (data.error) {
      appendError(data.error);
      // Pop the user message we just pushed so they can retry
      messages.pop();
    } else {
      // Render tool log
      if (data.toolLog && data.toolLog.length > 0) {
        appendToolBlocks(data.toolLog);
      }
      // Render assistant reply
      if (data.reply) {
        appendAssistantBubble(data.reply);
      }
      // Update conversation history
      messages = data.messages || messages;
    }
  } catch (e) {
    thinkingEl.remove();
    appendError('Network error: ' + e);
    messages.pop();
  } finally {
    setBusy(false);
    scrollToBottom();
    input.focus();
  }
}

// ── DOM helpers ─────────────────────────────────────────────────────────────
const conv = () => document.getElementById('conversation');

function scrollToBottom() {
  const c = conv();
  c.scrollTop = c.scrollHeight;
}

function appendUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="role-label">You</div>
    <div class="bubble">${escHtml(text)}</div>
  `;
  conv().appendChild(row);
  scrollToBottom();
}

function appendAssistantBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.innerHTML = `
    <div class="role-label">Assistant</div>
    <div class="bubble">${escHtml(text)}</div>
  `;
  conv().appendChild(row);
  scrollToBottom();
}

function appendToolBlocks(toolLog) {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  const wrapper = document.createElement('div');
  wrapper.className = 'tool-blocks';

  toolLog.forEach(entry => {
    const inputStr = typeof entry.input === 'object'
      ? JSON.stringify(entry.input, null, 2)
      : String(entry.input);
    const outputStr = String(entry.output || '');
    const preview = inputStr.length > 80 ? inputStr.slice(0, 80) + '…' : inputStr;

    const details = document.createElement('details');
    details.className = 'tool-block';
    details.innerHTML = `
      <summary class="tool-summary">
        <span class="tool-name-tag">🔧 ${escHtml(entry.tool)}</span>
        <span class="tool-input-preview">${escHtml(preview)}</span>
      </summary>
      <div class="tool-detail">
        <div>
          <div class="tool-section-label">Input</div>
          <div class="tool-code">${escHtml(inputStr)}</div>
        </div>
        <div>
          <div class="tool-section-label">Output</div>
          <div class="tool-code tool-output">${escHtml(outputStr)}</div>
        </div>
      </div>
    `;
    wrapper.appendChild(details);
  });

  row.appendChild(wrapper);
  conv().appendChild(row);
  scrollToBottom();
}

function appendThinking() {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.innerHTML = `
    <div class="thinking">
      <div class="thinking-dots">
        <span></span><span></span><span></span>
      </div>
      <span>Thinking…</span>
    </div>
  `;
  conv().appendChild(row);
  scrollToBottom();
  return row;
}

function appendError(msg) {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.innerHTML = `<div class="error-bubble">⚠️ ${escHtml(msg)}</div>`;
  conv().appendChild(row);
  scrollToBottom();
}

function showSystemNote(msg) {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.innerHTML = `<div class="error-bubble">${escHtml(msg)}</div>`;
  conv().appendChild(row);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function setBusy(state) {
  busy = state;
  document.getElementById('send-btn').disabled = state;
  document.getElementById('msg-input').disabled = state;
}

// ── Input behaviour ─────────────────────────────────────────────────────────
const inputEl = document.getElementById('msg-input');

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

inputEl.addEventListener('input', () => autoResize(inputEl));

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function fillPrompt(text) {
  inputEl.value = text;
  autoResize(inputEl);
  inputEl.focus();
}
</script>
</body>
</html>
