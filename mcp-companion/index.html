<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audacity コンパニオン · Codex</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c232d; --border: #2a313c;
    --text: #e6edf3; --muted: #8b949e; --accent: #4493f8; --accent2: #2ea043;
    --user: #1f2937; --tool: #15212b; --danger: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex; height: 100vh;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* ---- sidebar ---- */
  #sidebar {
    width: 260px; flex: 0 0 260px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  #sidebar h1 { font-size: 14px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  #sidebar h1 span { color: var(--accent); }
  #newchat {
    margin: 12px; padding: 9px 12px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;
  }
  #newchat:hover { filter: brightness(1.08); }
  #threads { flex: 1 1 auto; overflow-y: auto; padding: 0 8px 8px; min-height: 0; }
  .thread {
    padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 3px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px;
  }
  .thread:hover { background: var(--panel2); color: var(--text); }
  .thread.active { background: var(--panel2); color: var(--text); }
  .thread .t-title { color: var(--text); }
  .thread small { display: block; color: var(--muted); font-size: 11px; }
  #sidefoot { border-top: 1px solid var(--border); padding: 10px 12px; font-size: 12px; color: var(--muted); }
  /* ---- main ---- */
  #main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #statusbar {
    display: flex; gap: 8px; align-items: center; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel2); font-size: 12px; color: var(--muted); border: 1px solid var(--border);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--accent2); } .dot.bad { background: var(--danger); }
  .chip button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 3px 8px;
    cursor: pointer; font-size: 12px;
  }
  #grow { flex: 1; }
  /* ---- chat ---- */
  #chat { flex: 1 1 auto; overflow-y: auto; padding: 22px 0; }
  #chat-inner { max-width: 820px; margin: 0 auto; padding: 0 20px; }
  .msg { margin-bottom: 18px; display: flex; gap: 12px; }
  .avatar {
    flex: 0 0 28px; width: 28px; height: 28px; border-radius: 7px; font-size: 13px;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .msg.user .avatar { background: var(--user); }
  .msg.assistant .avatar { background: var(--accent); color: #fff; }
  .bubble { flex: 1 1 auto; min-width: 0; }
  .bubble .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .bubble .body { white-space: pre-wrap; word-wrap: break-word; }
  .reasoning { color: var(--muted); font-style: italic; font-size: 13px; white-space: pre-wrap; margin-bottom: 6px; }
  .tool {
    background: var(--tool); border: 1px solid var(--border); border-radius: 8px; margin: 8px 0;
    overflow: hidden; font-size: 13px;
  }
  .tool summary {
    cursor: pointer; padding: 8px 12px; list-style: none; display: flex; align-items: center; gap: 8px;
    user-select: none;
  }
  .tool summary::-webkit-details-marker { display: none; }
  .tool code { color: var(--accent); font-size: 12px; }
  .tool .args { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .tbody {
    border-top: 1px solid var(--border); padding: 10px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--muted); max-height: 320px; overflow: auto;
  }
  .tool .tbody b { color: var(--text); }
  .spin { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent);
          border-radius: 50%; animation: sp 0.8s linear infinite; display: inline-block; }
  @keyframes sp { to { transform: rotate(360deg); } }
  /* ---- composer ---- */
  #composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  #composer-inner { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 13px; font: inherit; max-height: 180px; min-height: 44px;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  #send, #stop {
    border: none; border-radius: 10px; padding: 0 18px; height: 44px; cursor: pointer; font-weight: 600;
  }
  #send { background: var(--accent); color: #fff; }
  #send:disabled { opacity: 0.5; cursor: default; }
  #stop { background: var(--danger); color: #fff; display: none; }
  .hint { color: var(--muted); font-size: 11px; text-align: center; margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty h2 { color: var(--text); font-weight: 600; }
  .examples { display: flex; flex-direction: column; gap: 8px; max-width: 460px; margin: 18px auto 0; }
  .examples button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; cursor: pointer; text-align: left; font: inherit;
  }
  .examples button:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <aside id="sidebar">
    <h1>Audacity <span>コンパニオン</span></h1>
    <button id="newchat">+ 新規チャット</button>
    <div id="threads"></div>
    <div id="sidefoot"><b>Codex app-server</b> 搭載<br/><span id="modelinfo"></span></div>
  </aside>

  <section id="main">
    <div id="statusbar">
      <span class="chip"><span id="d-audacity" class="dot"></span> Audacity</span>
      <span class="chip"><span id="d-codex" class="dot"></span> Codex</span>
      <span id="authchip" class="chip"><span id="d-auth" class="dot"></span> <span id="authtext">確認中…</span></span>
      <span id="grow"></span>
      <span id="modelchip" class="chip"></span>
    </div>

    <div id="chat"><div id="chat-inner"></div></div>

    <div id="composer">
      <div id="composer-inner">
        <textarea id="input" placeholder="Audacity に指示を入力…（例：440Hz のサイン波を 3 秒生成してノーマライズし /tmp/out.wav にエクスポート）"></textarea>
        <button id="send">送信</button>
        <button id="stop">停止</button>
      </div>
      <div class="hint">Enter で送信 · Shift+Enter で改行 · 会話は Codex スレッドとして保存されます</div>
    </div>
  </section>

<script>
const $ = (s, r=document) => r.querySelector(s);
const chatInner = $("#chat-inner");
const input = $("#input");
let threadId = localStorage.getItem("aud_thread_id") || null;
let streaming = false;
let cur = null; // current assistant message element

// ---------- rendering ----------
function clearChat() { chatInner.innerHTML = ""; }
function showEmpty() {
  clearChat();
  const div = document.createElement("div");
  div.className = "empty";
  div.innerHTML = `<h2>Audacity で何をしますか？</h2>
    <p>MCP ツールを通じて Audacity を操作します — 音声の生成・編集・計測・エクスポートが可能です。</p>
    <div class="examples">
      <button>440Hz のサイン波を 3 秒生成してノーマライズする</button>
      <button>現在開いているトラック数を教えて</button>
      <button>選択範囲のラウドネス（LUFS）とトゥルーピークを計測する</button>
      <button>フェードイン・フェードアウトを 0.5 秒ずつ追加して /tmp/out.wav にエクスポートする</button>
    </div>`;
  chatInner.appendChild(div);
  div.querySelectorAll(".examples button").forEach(b =>
    b.onclick = () => { input.value = b.textContent; input.focus(); });
}
function msgEl(role) {
  const m = document.createElement("div");
  m.className = "msg " + role;
  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = role === "user" ? "U" : "A";
  const b = document.createElement("div");
  b.className = "bubble";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "user" ? "あなた" : "Audacity コンパニオン";
  const body = document.createElement("div");
  body.className = "body";
  b.appendChild(who); b.appendChild(body);
  m.appendChild(av); m.appendChild(b);
  m._body = body; m._bubble = b;
  return m;
}
function addUser(text) {
  if ($(".empty")) clearChat();
  const m = msgEl("user"); m._body.textContent = text; chatInner.appendChild(m); scrollDown();
}
function ensureAssistant() {
  if ($(".empty")) clearChat();
  if (!cur) { cur = msgEl("assistant"); chatInner.appendChild(cur); }
  return cur;
}
function appendDelta(t) { const b = ensureAssistant()._body; b.textContent += t; scrollDown(); }
function setAssistant(t) { const b = ensureAssistant()._body; if (!b.textContent) b.textContent = t; scrollDown(); }
function addReasoning(t) {
  const m = ensureAssistant();
  if (!m._reason) {
    m._reason = document.createElement("div"); m._reason.className = "reasoning";
    m._bubble.insertBefore(m._reason, m._body);
  }
  m._reason.textContent += t; scrollDown();
}
function toolCard(d, running) {
  const m = ensureAssistant();
  const key = d.id || "t";
  let el = m._bubble.querySelector('.tool[data-id="' + cssEsc(key) + '"]');
  if (!el) {
    el = document.createElement("details");
    el.className = "tool"; el.dataset.id = key; el.open = false;
    el.innerHTML = `<summary><span class="st"></span>
      <code></code><span class="args"></span></summary><div class="tbody"></div>`;
    el.querySelector("code").textContent = (d.server || "audacity") + " · " + (d.tool || "");
    m._bubble.appendChild(el);
  }
  el.querySelector(".args").textContent = d.arguments ? JSON.stringify(d.arguments) : "";
  const st = el.querySelector(".st");
  const tb = el.querySelector(".tbody");
  if (running) { st.innerHTML = '<span class="spin"></span>'; tb.innerHTML = "<b>実行中…</b>"; }
  else {
    const okStatus = d.status === "completed";
    st.textContent = okStatus ? "✓" : "✕";
    st.style.color = okStatus ? "var(--accent2)" : "var(--danger)";
    let body = "";
    if (d.arguments) body += "<b>引数:</b> " + escapeHtml(JSON.stringify(d.arguments)) + "\n\n";
    body += "<b>結果:</b>\n" + escapeHtml(d.result || "（出力なし）");
    tb.innerHTML = body;
  }
  scrollDown();
}
function escapeHtml(s){ return (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function cssEsc(s){ return String(s).replace(/["\\]/g, "\\$&"); }
function scrollDown(){ const c = $("#chat"); c.scrollTop = c.scrollHeight; }

// ---------- status / auth ----------
function setDot(sel, ok){ const d = $(sel); d.classList.toggle("ok", !!ok); d.classList.toggle("bad", !ok); }
async function refreshStatus() {
  try {
    const r = await fetch("/api/status"); const s = await r.json();
    setDot("#d-audacity", s.audacity); setDot("#d-codex", s.codex);
    const acc = s.account && s.account.account;
    const logged = acc && (acc.type === "chatgpt" || acc.type === "apiKey");
    setDot("#d-auth", logged);
    const authtext = $("#authtext");
    if (logged && acc.type === "chatgpt") {
      authtext.textContent = "ChatGPT" + (acc.email ? " · " + acc.email : (acc.planType ? " · " + acc.planType : ""));
      const b = $("#loginbtn"); if (b) b.remove();
    } else if (logged) {
      authtext.textContent = acc.type;
      const b = $("#loginbtn"); if (b) b.remove();
    } else {
      authtext.textContent = "未ログイン";
      if (!$("#loginbtn")) {
        const btn = document.createElement("button"); btn.id = "loginbtn"; btn.textContent = "ChatGPT でログイン";
        btn.onclick = doLogin; $("#authchip").appendChild(btn);
      }
    }
    $("#modelchip").textContent = s.model ? ("モデル: " + s.model) : "モデル: アカウント既定";
    $("#modelinfo").textContent = s.audacityTools && s.audacityTools.length
      ? ("Audacity ツール: " + s.audacityTools.join(", ")) : "Audacity 未接続";
  } catch (e) { /* ignore */ }
}

async function doLogin() {
  const btn = $("#loginbtn"); if (btn){ btn.textContent = "ブラウザを開いています…"; btn.disabled = true; }
  try {
    const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({})});
    const d = await r.json();
    if (d.error) { alert("ログインエラー: " + d.error); if(btn){btn.textContent="ChatGPT でログイン";btn.disabled=false;} return; }
    if (d.authUrl) window.open(d.authUrl, "_blank");
    if (d.loginId) {
      if (btn) btn.textContent = "ログイン待機中…";
      const w = await fetch("/api/login/wait?loginId=" + encodeURIComponent(d.loginId));
      const wr = await w.json();
      if (!wr.success) alert("ログインに失敗しました: " + (wr.error || "不明なエラー"));
    }
  } catch (e) { alert("ログインエラー: " + e); }
  await refreshStatus();
}

// ---------- threads (memory) ----------
async function loadThreads() {
  try {
    const r = await fetch("/api/threads"); const d = await r.json();
    const box = $("#threads"); box.innerHTML = "";
    (d.threads || []).forEach(t => {
      const el = document.createElement("div");
      el.className = "thread" + (t.id === threadId ? " active" : "");
      const title = document.createElement("span"); title.className = "t-title"; title.textContent = t.title || "無題";
      el.appendChild(title);
      if (t.updatedAt) { const s = document.createElement("small"); s.textContent = new Date(t.updatedAt*1000).toLocaleString(); el.appendChild(s); }
      el.onclick = () => openThread(t.id);
      box.appendChild(el);
    });
  } catch (e) { /* ignore */ }
}

async function openThread(id) {
  if (streaming) return;
  threadId = id; localStorage.setItem("aud_thread_id", id);
  cur = null; clearChat();
  try {
    const r = await fetch("/api/thread?id=" + encodeURIComponent(id));
    const d = await r.json();
    const msgs = d.messages || [];
    if (!msgs.length) { showEmpty(); }
    else {
      msgs.forEach(m => {
        if (m.role === "user") { cur = null; addUser(m.text); }
        else if (m.role === "assistant") { setAssistant(m.text); cur = null; }
        else if (m.role === "tool") { ensureAssistant(); toolCard({id:"h"+Math.random(), server:m.server, tool:m.tool, arguments:m.arguments, status:"completed", result:m.result}, false); }
      });
    }
  } catch (e) { showEmpty(); }
  loadThreads();
}

function newChat() {
  if (streaming) return;
  threadId = null; localStorage.removeItem("aud_thread_id"); cur = null;
  showEmpty(); loadThreads();
}

// ---------- chat send (SSE over fetch) ----------
let abortCtl = null;
async function send() {
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = ""; input.style.height = "auto";
  addUser(text); cur = null;
  streaming = true; setStreaming(true);
  abortCtl = new AbortController();
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message: text, threadId}), signal: abortCtl.signal,
    });
    if (!resp.ok || !resp.body) {
      const t = await resp.text(); throw new Error(t || ("HTTP " + resp.status));
    }
    await readSSE(resp.body);
  } catch (e) {
    if (e.name !== "AbortError") { ensureAssistant()._body.textContent += "\n[エラー] " + e.message; }
  } finally {
    streaming = false; setStreaming(false); abortCtl = null;
    loadThreads();
  }
}

async function readSSE(stream) {
  const reader = stream.getReader();
  const dec = new TextDecoder();
  let buf = "";
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
      let ev = "message", data = "";
      raw.split("\n").forEach(line => {
        if (line.startsWith("event:")) ev = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      });
      if (data) { try { handleEvent(ev, JSON.parse(data)); } catch(e){} }
    }
  }
}

function handleEvent(ev, d) {
  if (ev === "meta") {
    if (d.threadId) { threadId = d.threadId; localStorage.setItem("aud_thread_id", threadId); }
  } else if (ev === "delta") { appendDelta(d.text);
  } else if (ev === "reasoning") { addReasoning(d.text);
  } else if (ev === "tool_start") { toolCard(d, true);
  } else if (ev === "tool_end") { toolCard(d, false);
  } else if (ev === "message") { setAssistant(d.text);
  } else if (ev === "done") { cur = null;
  } else if (ev === "error") { ensureAssistant()._body.textContent += "\n[エラー] " + (d.message||""); cur = null; }
}

async function stop() {
  if (abortCtl) abortCtl.abort();
  if (threadId) { try { await fetch("/api/interrupt", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({threadId})}); } catch(e){} }
}

function setStreaming(on) {
  $("#send").disabled = on; $("#stop").style.display = on ? "block" : "none";
  $("#send").style.display = on ? "none" : "block";
}

// ---------- events ----------
$("#newchat").onclick = newChat;
$("#send").onclick = send;
$("#stop").onclick = stop;
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; });

// ---------- init ----------
(async function init(){
  await refreshStatus();
  await loadThreads();
  if (threadId) openThread(threadId); else showEmpty();
  setInterval(refreshStatus, 8000);
})();
</script>
</body>
</html>
